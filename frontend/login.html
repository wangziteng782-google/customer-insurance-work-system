<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 易梯保险系统</title>
<link rel="icon" href="images/logo.png" type="image/png">
<style>
  /* ── 主题变量：换主色只改这里 ── */
  :root {
    --brand: #5b4bdb;
    --brand-hover: #6e5fe8;
    --brand-active: #4a3bc4;
    --page-bg: #e4dffd;
    --blob-a: #8a78f3;
    --blob-b: #6a55e8;
    --text: #1f1c33;
    --text-sub: #8a86a6;
    --border: #e6e3f4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { overflow-x: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-bg);
    color: var(--text);
  }

  /* ── 背景装饰色块：轮廓自设计稿提取，纯内联 SVG，无外部图片 ── */
  .bg-decor {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  /* 以各自贴边的角为原点轻微缩放：既保持贴边，又有缓慢呼吸感 */
  .bg-decor .tr {
    transform-origin: 1080px 0px;
    animation: breathe-tr 26s ease-in-out infinite;
  }
  .bg-decor .bl {
    transform-origin: 0px 724px;
    animation: breathe-bl 32s ease-in-out infinite;
  }
  @keyframes breathe-tr {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.035); }
  }
  @keyframes breathe-bl {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  /* ── 登录卡片 ── */
  .login-card {
    position: relative;
    z-index: 1;
    width: min(380px, calc(100vw - 32px));
    padding: 48px 40px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(78, 60, 170, 0.16), 0 2px 8px rgba(78, 60, 170, 0.06);
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .login-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: contain;
    flex: none;
  }
  .login-title {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* ── 表单：尺寸与内容保持原版，仅颜色跟随主题 ── */
  .login-subtitle {
    margin: 14px 0 32px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input::placeholder { color: #b2aec9; }
  .form-group input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(91, 75, 219, 0.12);
  }

  .login-btn {
    width: 100%;
    height: 42px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(91, 75, 219, 0.28);
    transition: background 0.2s, box-shadow 0.2s, transform 0.12s;
  }
  .login-btn:hover { background: var(--brand-hover); box-shadow: 0 10px 22px rgba(91, 75, 219, 0.34); }
  .login-btn:active { background: var(--brand-active); transform: translateY(1px); box-shadow: 0 4px 12px rgba(91, 75, 219, 0.24); }
  .login-btn:disabled { background: #c3bbf2; box-shadow: none; cursor: not-allowed; transform: none; }

  .error-msg {
    margin-top: 14px;
    padding: 9px 12px;
    background: #fff2f0;
    border: 1px solid #ffccc7;
    border-radius: 8px;
    color: #ff4d4f;
    font-size: 12.5px;
    display: none;
  }
  .error-msg.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .bg-decor .tr, .bg-decor .bl { animation: none; }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="card-head">
    <img class="login-logo" src="images/logo.png" alt="易梯" onerror="this.style.display='none'">
    <div class="login-title">易梯保险系统</div>
  </div>

  <div class="login-subtitle">请使用手机号登录</div>

  <form id="loginForm">
    <div class="form-group">
      <label for="phone">手机号</label>
      <input type="tel" id="phone" placeholder="请输入手机号" autocomplete="tel" maxlength="11">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn" id="loginBtn">登 录</button>
  </form>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var phone = document.getElementById('phone').value.trim();
  var password = document.getElementById('password').value;
  var errorMsg = document.getElementById('errorMsg');
  var btn = document.getElementById('loginBtn');

  errorMsg.classList.remove('show');
  errorMsg.textContent = '';

  if (!phone || !password) {
    errorMsg.textContent = '请输入手机号和密码';
    errorMsg.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    var formData = new FormData();
    formData.append('phone', phone);
    formData.append('password', password);

    var resp = await fetch('/api/users/login', { method: 'POST', body: formData });
    if (!resp.ok) {
      errorMsg.textContent = '手机号或密码错误';
      errorMsg.classList.add('show');
      btn.disabled = false;
      btn.textContent = '登 录';
      return;
    }

    var user = await resp.json();
    localStorage.setItem('token', user.token);
    localStorage.setItem('currentUser', JSON.stringify(user));
    window.location.href = 'index.html';
  } catch (err) {
    errorMsg.textContent = '网络错误，请稍后重试';
    errorMsg.classList.add('show');
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
